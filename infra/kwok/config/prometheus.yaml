global:
  scrape_interval: 5s

scrape_configs:
  - job_name: kube-state-metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/ksm-*.json"]

  - job_name: kwok-usage
    scheme: https
    tls_config:
      insecure_skip_verify: true
    file_sd_configs:
      - files: ["/etc/prometheus/targets/usage-*.json"]