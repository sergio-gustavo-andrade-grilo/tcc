services:
  kube-state-metrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
    container_name: ksm-${CLUSTER}
    network_mode: host
    volumes:
      - ./.generated/${CLUSTER}/kubeconfig:/kubeconfig:ro
    command:
      - --kubeconfig=/kubeconfig
      - --port=${KSM_PORT:-8080}
      - --telemetry-port=${KSM_TELEMETRY_PORT:-8081}