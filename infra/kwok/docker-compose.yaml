services:
  kube-state-metrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
    container_name: tcc-ksm
    network_mode: host
    volumes:
      - ./.generated/kubeconfig:/kubeconfig:ro
    command: ["--kubeconfig=/kubeconfig"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tcc-prometheus
    network_mode: host
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./.generated/targets:/etc/prometheus/targets:ro
